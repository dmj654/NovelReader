name: Build Signed IPA (installable)

# 产出"已经签好名、下载就能装进 iPhone"的 IPA。
# 适用于：你有付费开发者证书（或企业证书）的情况。
# 想把签名交给自己的工具（爱思助手 / Sideloadly / iOS App Signer）的话，
# 用另一个 workflow：build-ipa.yml（不需要任何 Secrets）。
#
# 触发：Actions 页面点 Run workflow，选择导出方式。

on:
  workflow_dispatch:
    inputs:
      export_method:
        description: 导出方式
        required: true
        default: development
        type: choice
        options:
          - development   # 开发证书：profile 里必须包含目标 iPhone 的 UDID
          - ad-hoc        # Ad Hoc 分发：同样需要 UDID，可发给有限设备
          - enterprise    # 企业 In-House：不需要 UDID
          - app-store     # 上传 App Store / TestFlight（不产生可直装 IPA）

jobs:
  build:
    name: Sign & Export
    runs-on: macos-15
    timeout-minutes: 40

    env:
      # 没配证书时自动回退为"仅编译不签名"，保证 workflow 永不失败
      HAS_CERT: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen & generate project
        run: |
          brew install xcodegen
          xcodegen generate

      # ---------- 导入证书与描述文件 ----------
      - name: Import signing certificate
        if: ${{ env.HAS_CERT == 'true' }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          BUILD_PROVISIONING_PROFILE_BASE64: ${{ secrets.BUILD_PROVISIONING_PROFILE_BASE64 }}
        run: |
          CERT_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$BUILD_PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/
          echo "✅ 证书与描述文件已导入"

      # ---------- 归档 ----------
      - name: Archive (signed)
        if: ${{ env.HAS_CERT == 'true' }}
        env:
          CODE_SIGN_IDENTITY: ${{ secrets.CODE_SIGN_IDENTITY }}
          PROVISIONING_PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          xcodebuild \
            -project NovelReader.xcodeproj \
            -scheme NovelReader \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath build/NovelReader.xcarchive \
            -allowProvisioningUpdates \
            archive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$CODE_SIGN_IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROVISIONING_PROFILE_NAME" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            PRODUCT_BUNDLE_IDENTIFIER=com.novelreader.app

      - name: Archive (unsigned fallback)
        if: ${{ env.HAS_CERT != 'true' }}
        run: |
          xcodebuild \
            -project NovelReader.xcodeproj \
            -scheme NovelReader \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath build/NovelReader.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" PROVISIONING_PROFILE_SPECIFIER="" \
            PRODUCT_BUNDLE_IDENTIFIER=com.novelreader.app

      # ---------- 导出 ----------
      - name: Write ExportOptions.plist
        if: ${{ env.HAS_CERT == 'true' }}
        run: |
          mkdir -p build
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>${{ inputs.export_method }}</string>
            <key>teamID</key>
            <string>${{ secrets.DEVELOPMENT_TEAM }}</string>
            <key>signingCertificate</key>
            <string>${{ secrets.CODE_SIGN_IDENTITY }}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.novelreader.app</key>
              <string>${{ secrets.PROVISIONING_PROFILE_NAME }}</string>
            </dict>
            <key>compileBitcode</key>
            <false/>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
            <key>signingStyle</key>
            <string>manual</string>
            <key>destination</key>
            <string>export</string>
          </dict>
          </plist>
          PLIST

      - name: Export signed IPA
        if: ${{ env.HAS_CERT == 'true' }}
        run: |
          xcodebuild -exportArchive \
            -archivePath build/NovelReader.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist build/ExportOptions.plist \
            -allowProvisioningUpdates
          ls -lh build/export/*.ipa

      - name: Package unsigned IPA (fallback)
        if: ${{ env.HAS_CERT != 'true' }}
        run: |
          rm -rf build/Payload && mkdir -p build/Payload
          cp -R build/NovelReader.xcarchive/Products/Applications/*.app build/Payload/
          mkdir -p build/export
          (cd build && zip -qry export/NovelReader-unsigned.ipa Payload)
          ls -lh build/export/*.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NovelReader-${{ inputs.export_method }}-ipa
          path: build/export/*.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Summary
        run: |
          if [ "${{ env.HAS_CERT }}" = "true" ]; then
            echo "### 已签名 IPA 构建完成 ✅" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "导出方式：\`${{ inputs.export_method }}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "下载后可用爱思助手 / Apple Configurator / iTunes 直接安装到 iPhone 13 Pro。" >> $GITHUB_STEP_SUMMARY
          else
            echo "### 未配置证书 → 产出的是未签名 IPA ⚠️" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "需要自己用工具签名后安装。想让 CI 直接签名，请到" >> $GITHUB_STEP_SUMMARY
            echo "Settings → Secrets and variables → Actions 配置证书相关 Secrets。" >> $GITHUB_STEP_SUMMARY
          fi
