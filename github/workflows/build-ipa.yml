name: Build iOS IPA (unsigned)

# 在 GitHub 的 macOS 云端机器上编译，产出未签名 IPA。
# 拿到 IPA 后，用 Windows 上的 Sideloadly / AltServer 用自己的 Apple ID 签名装进 iPhone。
#
# 触发方式：push 到 main，或在 Actions 页面点 Run workflow。

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "NovelReader/**"
      - "project.yml"
      - ".github/workflows/build-ipa.yml"

jobs:
  build:
    name: Archive & Package
    runs-on: macos-15          # 也可用 macos-14；公开仓库免费使用
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive (signing disabled)
        run: |
          xcodebuild \
            -project NovelReader.xcodeproj \
            -scheme NovelReader \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath build/NovelReader.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            PRODUCT_BUNDLE_IDENTIFIER=com.novelreader.app

      - name: Package unsigned IPA
        run: |
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R build/NovelReader.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -qry NovelReader-unsigned.ipa Payload
          ls -lh NovelReader-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovelReader-unsigned-ipa
          path: build/NovelReader-unsigned.ipa
          retention-days: 30

      - name: Summary
        run: |
          echo "### 构建完成 ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "在 Artifacts 里下载 \`NovelReader-unsigned-ipa\`，" >> $GITHUB_STEP_SUMMARY
          echo "再用 Sideloadly / AltServer 用自己的 Apple ID 签名安装到 iPhone。" >> $GITHUB_STEP_SUMMARY
