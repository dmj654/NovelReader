# XcodeGen 工程描述：用于自动生成 NovelReader.xcodeproj
# 使用方式（在 macOS 上）：brew install xcodegen && xcodegen generate
#
# ⚠️ 两个反复踩过的坑，改动前务必知道：
# 1) resources 不能指向 sources group 内部又被 excludes 排除的路径 ——
#    那样 XcodeGen 不会把它加进 Resources 构建阶段，Assets.xcassets 整个不进包，
#    表现为"App 图标空白 + 所有语义色丢失"（ Archive 日志里连 actool 都不会调用）。
#    正确做法：sources 排除 Resources/**，resources 指向**整个 Resources 目录**。
# 2) info 块必须有 path + properties，且与 GENERATE_INFOPLIST_FILE 互斥。
#    本工程需要 Info.plist 里带 NSAppTransportSecurity（http 书源）与
#    CFBundleDocumentTypes（从文件 App 分享打开），所以用 info 块、
#    不再用 GENERATE_INFOPLIST_FILE + INFOPLIST_KEY_*。

name: NovelReader

options:
  bundleIdPrefix: com.novelreader
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: none
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_PREVIEWS: "YES"
    CLANG_ENABLE_MODULES: "YES"
    SWIFT_EMIT_LOC_STRINGS: "YES"
    ENABLE_USER_SELECTED_FILES: "readonly"

targets:
  NovelReader:
    type: application
    platform: iOS
    sources:
      - path: NovelReader
        excludes:
          - "Preview Content/**"
          - "**/*.md"
    # 资源目录与源码目录平级（仓库根下 Resources/）。
    # ⚠️ 不能放在 NovelReader/Resources 再用 excludes 排除——那样 XcodeGen 不会把
    # asset catalog 加进 Resources 构建阶段，Archive 日志里连 actool 都不会调用，
    # 表现为「App 图标空白 + 全部语义色丢失」。
    resources:
      - path: Resources
    # 显式 Info.plist：需要 ATS 例外（http 书源）与文档类型（分享打开）
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: 阅栈
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleName: $(PRODUCT_NAME)
        LSApplicationCategoryType: "public.app-category.books"
        # iOS 17 起可用生成的启动屏，无需 LaunchScreen.storyboard
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # 允许"文件"App 直接把 TXT / JSON 分享/打开到本 App
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: "Text Document"
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.plain-text
              - public.text
              - public.data
          - CFBundleTypeName: "JSON Source"
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.json
        # 书源站点良莠不齐，允许 http 以免整站抓不下来（v1.2 书源没反应的根因）
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_NAME: 阅栈
        PRODUCT_BUNDLE_IDENTIFIER: com.novelreader.app
        # 版本号：装到手机后，在「我的 → 版本」能看到，用来确认装的是不是最新版
        MARKETING_VERSION: "1.2.1"
        CURRENT_PROJECT_VERSION: "4"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""   # 本机 Xcode 自动签名时会写入，仓库中留空

schemes:
  NovelReader:
    build:
      targets:
        NovelReader: all
    run:
      config: Debug
    archive:
      config: Release
